services:
  config-viewer:
    build: .
    image: config-viewer:latest
    container_name: config-viewer
    restart: unless-stopped
    network_mode: host   # hostname/IPs reais do servidor (ignora "ports")
    environment:
      APP_NAME: ${APP_NAME:-config-viewer}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PORT: ${APP_PORT:-8080}
    volumes:
      - /etc/os-release:/host/os-release:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.getenv('PORT','8080'))"]
      interval: 30s
      timeout: 5s
      retries: 3
